name: CI - Execution Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Install SonarScanner
        run: dotnet tool update dotnet-sonarscanner --tool-path "$RUNNER_TEMP/sonar"

      - name: Restore
        run: dotnet restore Tests/ExecutionService.Tests/ExecutionService.Tests.csproj

      - name: Begin SonarCloud analysis
        run: '"$RUNNER_TEMP/sonar/dotnet-sonarscanner" begin /k:"Venomouus_oficina-execution-service" /o:"venomouus" /d:sonar.token="$SONAR_TOKEN" /d:sonar.cs.opencover.reportsPaths="Tests/ExecutionService.Tests/TestResults/**/coverage.opencover.xml" /d:sonar.coverage.exclusions="**/*.ps1" /d:sonar.qualitygate.wait=true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build
        run: dotnet build Tests/ExecutionService.Tests/ExecutionService.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Tests/ExecutionService.Tests/ExecutionService.Tests.csproj --no-build --no-restore --configuration Release --collect:"XPlat Code Coverage" --results-directory Tests/ExecutionService.Tests/TestResults/ci -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover

      - name: Enforce production line coverage
        run: pwsh -File Tests/verify-coverage.ps1 -ResultsDirectory Tests/ExecutionService.Tests/TestResults/ci

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-service-coverage
          path: Tests/ExecutionService.Tests/TestResults/ci/**/coverage.cobertura.xml

      - name: End SonarCloud analysis
        if: always()
        run: '"$RUNNER_TEMP/sonar/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Docker build
        run: docker build --tag oficina-execution-service:${{ github.sha }} .

  publish-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        run: |
          docker build -t ghcr.io/venomouus/oficina-execution-service:${{ github.sha }} -t ghcr.io/venomouus/oficina-execution-service:latest .
          docker push ghcr.io/venomouus/oficina-execution-service:${{ github.sha }}
          docker push ghcr.io/venomouus/oficina-execution-service:latest
      - name: Deploy to Kubernetes
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          test -n "$KUBE_CONFIG_B64" || { echo 'Configure KUBE_CONFIG_B64 no repositorio'; exit 1; }
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl get namespace oficina
          kubectl -n oficina get secret messaging-secrets execution-service-secrets
          kubectl -n oficina apply -f k8s/deployment.yaml
          kubectl -n oficina set image deployment/execution-service execution-service=ghcr.io/venomouus/oficina-execution-service:${{ github.sha }}
          kubectl -n oficina rollout status deployment/execution-service --timeout=180s
