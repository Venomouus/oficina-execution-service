apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: oficina
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
    spec:
      containers:
        - name: execution-service
          image: ghcr.io/venomouus/oficina-execution-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: observability-config
                  key: otlp-endpoint
                  optional: true
            - name: Mongo__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: execution-service-secrets
                  key: database-connection
            - name: Mongo__Database
              value: oficina_execution
            - name: RabbitMq__Host
              value: rabbitmq
            - name: RabbitMq__Port
              value: "5672"
            - name: RabbitMq__User
              valueFrom:
                secretKeyRef:
                  name: messaging-secrets
                  key: username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: messaging-secrets
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: execution-service
  namespace: oficina
spec:
  selector:
    app: execution-service
  ports:
    - port: 8083
      targetPort: 8080
  type: ClusterIP
